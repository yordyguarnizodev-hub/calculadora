<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="actividad-mundial.css" />
  </head>

  <body>
    <h1>Shopping Cart</h1>
    <main class="container">
      <div class="addContainer">
        <section class="card">
          <h2>Add Product</h2>

          <div class="input-group">
            <input type="text" id="productName" placeholder="Name" />
            <select
              name="month-holder"
              id="monthHolder"
              onchange="showMatches()"
            >
              <option value="">Select a month</option>
              <option value="June">June</option>
              <option value="July">July</option>
            </select>

            <select
              name="matchs-holder"
              id="matchHolder"
              hidden
              onchange="showMatchInformation(this)"
            >
              <!-- <option value="">Select a match</option>
              <option value="Match 1">Match 1</option>
              <option value="Match 2">Match 2</option> -->
            </select>
          </div>

          <button onclick="addToCart()">Add to Cart</button>
          <p id="messageArea"></p>
        </section>
      </div>

      <div class="shoppingContainer">
        <section class="card">
          <h2>Cart Contents</h2>

          <div id="cartOutput"></div>

          <div class="totals">
            <h3>Total: $<span id="finalTotal">0.00</span></h3>
          </div>
        </section>
      </div>
    </main>
    <script src="actividad-mundial.js"></script>
  </body>
</html>
