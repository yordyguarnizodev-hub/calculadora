<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="mundialShopCart.css" />

    <title>Shopping Cart</title>
  </head>

  <body>
    <main class="container">
      <h1>Shopping Cart</h1>

      <!-- FORM CARD -->
      <section class="card">
        <h2>Add Tickets</h2>

        <div class="input-group">
          <input type="text" id="fullName" placeholder="Full Name" />

          <input type="number" id="productQuantity" placeholder="Quantity" />
        </div>

        <button onclick="addToCart()">Add to Cart</button>

        <p id="messageArea"></p>
      </section>

      <!-- CART -->
      <section id="cartContainer" class="card"></section>
    </main>

    <script src="mundialShopCart.js"></script>
  </body>
</html>
